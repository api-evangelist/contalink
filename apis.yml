aid: contalink
name: Contalink
description: >-
  Contalink is a Mexican cloud accounting and payroll platform ("contabilidad en
  la nube") built for independent accountants, accounting firms (despachos) and
  SMEs. It automates repetitive Mexican fiscal work — bulk CFDI download and
  classification, electronic accounting, DIOT preparation, treasury and bank
  reconciliation, invoicing (facturación) and payroll (nómina) with digital
  stamping — across multiple companies and users. Contalink also exposes a REST
  API that lets external systems read and post accounting data: trial balance
  (balanza de comprobación), account balances, manual accounting policies
  (pólizas manuales), invoice reconciliation (conciliación), bank transactions
  (movimientos bancarios) and CFDI fiscal-document listing, upload and status
  checks. The API authenticates with a per-company API key sent in the
  Authorization header. Backed by 500 Global.
