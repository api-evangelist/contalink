openapi: 3.0.0
info:
  description: '# Introducción

    Documentación del API de Contalink


    # Autenticación


    El método de autenticación para el api de contalink es mediante un api key el cual está relacionado forzosamente a un usuario dentro del sistema, por lo cual, todas las peticiones utilizando ese api key quedarán registradas como peticiones del usuario relacionado.


    <SecurityDefinitions />

    '
  title: API Contalink Balanza de comprobación Pólizas manuales API
  version: 1.0.4
  x-logo:
    altText: Contalink
    url: http://apidocs.contalink.com/logocontalinknew.svg
servers:
- description: prod
  url: https://794lol2h95.execute-api.us-east-1.amazonaws.com/prod
tags:
- description: Gestiona altas, bajas y cambios de las pólizas manuales.
  name: Pólizas manuales
paths:
  /accounting/manual-accounting-policy/:
    post:
      description: Endpoint para crear pólizas manuales.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualPolicy'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualPolicyResponse'
          description: 0 indica error, 1 indica éxito
      security:
      - APIKey: []
      summary: Crea una póliza manual.
      tags:
      - Pólizas manuales
      x-codeSamples:
      - lang: C
        source: "CURL *curl;\nCURLcode res;\ncurl = curl_easy_init();\nif(curl) {\n   curl_easy_setopt(curl, CURLOPT_CUSTOMREQUEST, \"POST\");\n   curl_easy_setopt(curl, CURLOPT_URL, \"%7B%7BbaseUrl%7D%7D/accounting/manual-accounting-policy/\");\n   curl_easy_setopt(curl, CURLOPT_FOLLOWLOCATION, 1L);\n   curl_easy_setopt(curl, CURLOPT_DEFAULT_PROTOCOL, \"https\");\n   struct curl_slist *headers = NULL;\n   headers = curl_slist_append(headers, \"Content-Type: application/json\");\n   headers = curl_slist_append(headers, \"Accept: application/json\");\n   headers = curl_slist_append(headers, \"Content-Length: \");\n   curl_easy_setopt(curl, CURLOPT_HTTPHEADER, headers);\n   const char *data = \"{\\n  \\\"record_date\\\": \\\"<date>\\\",\\n  \\\"description\\\": \\\"<string>\\\",\\n  \\\"accounting_records\\\": {\\n    \\\"account_code\\\": \\\"<string>\\\",\\n    \\\"debit\\\": \\\"<number>\\\",\\n    \\\"credit\\\": \\\"<number>\\\"\\n  }\\n}\";\n   curl_easy_setopt(curl, CURLOPT_POSTFIELDS, data);\n   res = curl_easy_perform(curl);\n}\ncurl_easy_cleanup(curl);\n"
      - lang: C#
        source: 'var client = new RestClient("{{baseUrl}}/accounting/manual-accounting-policy/");

          client.Timeout = -1;

          var request = new RestRequest(Method.POST);

          request.AddHeader("Content-Type", "application/json");

          request.AddHeader("Accept", "application/json");

          var body = @"{" + "\n" +

          @"  ""record_date"": ""<date>""," + "\n" +

          @"  ""description"": ""<string>""," + "\n" +

          @"  ""accounting_records"": {" + "\n" +

          @"    ""account_code"": ""<string>""," + "\n" +

          @"    ""debit"": ""<number>""," + "\n" +

          @"    ""credit"": ""<number>""" + "\n" +

          @"  }" + "\n" +

          @"}";

          request.AddParameter("application/json", body,  ParameterType.RequestBody);

          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);'
