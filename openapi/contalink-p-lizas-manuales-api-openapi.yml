      - lang: Dart
        source: "var headers = {\n   'Content-Type': 'application/json',\n   'Accept': 'application/json'\n};\nvar request = http.Request('POST', Uri.parse('{{baseUrl}}/accounting/manual-accounting-policy/'));\nrequest.body = json.encode({\n   \"record_date\": \"<date>\",\n   \"description\": \"<string>\",\n   \"accounting_records\": {\n      \"account_code\": \"<string>\",\n      \"debit\": \"<number>\",\n      \"credit\": \"<number>\"\n   }\n});\nrequest.headers.addAll(headers);\n\nhttp.StreamedResponse response = await request.send();\n\nif (response.statusCode == 200) {\n   print(await response.stream.bytesToString());\n}\nelse {\n   print(response.reasonPhrase);\n}\n"
      - lang: Go
        source: "package main\n\nimport (\n   \"fmt\"\n   \"strings\"\n   \"net/http\"\n   \"io/ioutil\"\n)\n\nfunc main() {\n\n   url := \"%7B%7BbaseUrl%7D%7D/accounting/manual-accounting-policy/\"\n   method := \"POST\"\n\n   payload := strings.NewReader(`{\n  \"record_date\": \"<date>\",\n  \"description\": \"<string>\",\n  \"accounting_records\": {\n    \"account_code\": \"<string>\",\n    \"debit\": \"<number>\",\n    \"credit\": \"<number>\"\n  }\n}`)\n\n   client := &http.Client {\n   }\n   req, err := http.NewRequest(method, url, payload)\n\n   if err != nil {\n      fmt.Println(err)\n      return\n   }\n   req.Header.Add(\"Content-Type\", \"application/json\")\n   req.Header.Add(\"Accept\", \"application/json\")\n\n   res, err := client.Do(req)\n   if err != nil {\n      fmt.Println(err)\n      return\n   }\n   defer res.Body.Close()\n\n   body, err := ioutil.ReadAll(res.Body)\n   if err != nil {\n      fmt.Println(err)\n      return\n   }\n   fmt.Println(string(body))\n}"
