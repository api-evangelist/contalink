        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.post(\"{{baseUrl}}/accounting/manual-accounting-policy/\")\n   .header(\"Content-Type\", \"application/json\")\n   .header(\"Accept\", \"application/json\")\n   .header(\"Content-Length\", \"\")\n   .body(\"{\\n  \\\"record_date\\\": \\\"<date>\\\",\\n  \\\"description\\\": \\\"<string>\\\",\\n  \\\"accounting_records\\\": {\\n    \\\"account_code\\\": \\\"<string>\\\",\\n    \\\"debit\\\": \\\"<number>\\\",\\n    \\\"credit\\\": \\\"<number>\\\"\\n  }\\n}\")\n   .asString();\n"
