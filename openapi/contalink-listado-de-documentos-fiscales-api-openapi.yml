components:
  schemas:
    InvoiceList:
      properties:
        list:
          default: {}
          description: Nodo que contiene el listado de documentos encontrados, así como información sobre la paginación.
          properties:
            invoices:
              description: Arreglo con las facturas encontradas de acuerdo a los filtros proporcionados
              items:
                anyOf:
                - description: Contiene la información sobre un documento fiscal
                  properties:
                    conceptos:
                      default: []
                      description: Detalle los productos / servicios que se incluyen en el documento
                      items:
                        anyOf:
                        - default: {}
                          description: Producto / servicio que se incluye en el documento
                          properties:
                            cantidad:
                              default: 0
                              description: Indica la cantidad que se compra / vende para este producto / servicio
                              title: Cantidad
                              type: number
                            clave_sat:
                              default: ''
                              description: Clave SAT del producto / servicio de acuerdo al catálogo del SAT
                              title: Clave SAT
                              type: string
                            id_number:
                              default: ''
                              description: Identificador del producto / servicio
                              title: Identificador
                              type: string
                            importe:
                              default: 0
                              description: Indica la cantidad vendida multiplicada por el precio unitario
                              title: Importe
                              type: integer
                            impuestos:
                              default: []
                              description: Impuestos correspondientes al concepto
                              items:
                                anyOf:
                                - default: {}
                                  description: Impuesto correspondiente al concepto
                                  properties:
                                    base:
                                      default: 0.0
                                      description: Indica la base impositiva para el cálculo de impuestos
                                      title: Base
                                      type: number
                                    importe:
                                      default: 0.0
                                      description: Indica el importe de impuestos aplicable a este producto / servicio
                                      title: Importe
                                      type: number
                                    impuesto:
                                      default: ''
                                      description: Nombre del impuesto que se está aplicando al producto / servicio
                                      title: Impuesto
                                      type: string
                                    retencion:
                                      default: false
                                      description: Indica si el impuesto es una retención, de lo contrario, es un traslado
                                      title: Retención
                                      type: boolean
                                    tasaocuota:
                                      default: 0.0
                                      description: Indica la tasa o cuota aplicable a este producto / servicio
                                      title: Tasa o Cuota
                                      type: number
                                    tipofactor:
                                      default: ''
                                      description: Indica si el cálculo de este impuesto se hace por Tasa o por Cuota
                                      title: Tipo de Factor
                                      type: string
                                  title: Impuesto
                                  type: object
                              title: Impuestos
                              type: array
                            precio_unitario:
                              default: 0
                              description: Precio unitario del producto / servicio
                              title: Precio
                              type: number
                            producto:
                              default: ''
                              description: Nombre del producto o servicio
                              title: Producto
                              type: string
                            total:
                              default: 0
                              description: Precio del producto multiplicado por la cantidad
                              title: Total del concepto
                              type: integer
                            unidad:
                              default: null
                              description: Unidad de medida del producto / servicio de acuerdo al catálogo del SAT
                              title: Unidad
                              type: string
                          title: Concepto
                          type: object
                      title: Conceptos
                      type: array
                    descuento:
                      default: 0
                      description: Descuento aplicable al documento
                      title: Descuento
                      type: number
                    es_nomina:
                      default: false
                      description: Indica si el documento en cuestión es un recibo de nómina
                      title: Es Nomina?
                      type: boolean
                    estatus:
                      default: ''
                      description: Indica si el documento está Vigente o Cancelado ante el SAT.
                      title: Estatus
                      type: string
                    fecha_expedicion:
                      default: ''
                      description: Fecha en que se expidió el documento
                      format: date
                      title: Fecha de expedición
                      type: string
                    folio:
                      default: ''
                      description: Indica el folio de este documento
                      title: Folio
                      type: string
                    nombre_emisor:
                      default: ''
                      description: Razón social de la empresa que emite el documento
                      title: Razón social del emisor
                      type: string
                    nombre_receptor:
                      default: ''
                      description: Razón social de la empresa que recibe el documento
                      title: Razón social del receptor
                      type: string
                    rfc_emisor:
                      default: ''
                      description: RFC de la empresa que emite el documento
                      title: RFC Emisor
                      type: string
                    rfc_receptor:
                      default: ''
                      description: Indica el RFC de la empresa que recibe este documento
                      title: RFC Receptor
                      type: string
                    serie:
                      default: ''
                      description: Indica la serie de este documento
                      title: Serie
                      type: string
                    subtotal:
                      default: 0
                      description: Valor del documento antes de impuestos y descuentos
                      title: Subtotal
                      type: integer
                    tipo_de_comprobante:
                      default: ''
                      description: Indica el tipo de comprobante del documento en cuestión.
                      title: Tipo de comprobante
                      type: string
                    total:
                      default: 0.0
                      description: Valor total del documento
                      title: Total
                      type: number
                    uuid:
                      default: ''
                      description: Identificador único del documento
                      title: UUID
                      type: string
                  title: Documento
                  type: object
              title: Facturas encontradas
              type: array
            length:
              default: 0
              description: Indica el número de documentos en esta página
              title: Tamaño de página
              type: integer
            next_page:
              default: 0
              description: Indica cual es la siguiente página en caso de que haya más de 500 registros
              title: Siguiente página
              type: integer
            total:
              default: 0
              description: Número total de documentos encontrados
              title: Total
              type: integer
          title: Listado de documentos
          type: object
        message:
          default: ''
          description: Mensaje de éxito o error generado por la petición
          title: Mensaje
          type: string
        status:
          default: 0
          description: Indica el status de la petición 0. Error, 1. Éxito
          title: Status
          type: integer
      type: object
  securitySchemes:
    APIKey:
      description: Llave de API relacionada al usuario que hace la petición.
      in: header
      name: Authorization
      type: apiKey
