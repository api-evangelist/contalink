components:
  schemas:
    BankTransaction:
      properties:
        bank:
          default: ''
          description: Banco / Caja / Tarjeta donde se realiza el movimiento bancario
          title: Banco
          type: string
        date:
          default: ''
          description: Fecha del movimiento bancario (YYYY-MM-DD)
          format: date
          title: Fecha
          type: string
        deposit:
          default: 0
          description: En caso de ser un depósito a la cuenta, el monto depositado
          title: Deposito
          type: number
        description:
          default: ''
          description: Descripción del movimiento bancario
          title: Descripción
          type: string
        reference:
          default: ''
          description: Referencia del movimiento bancario
          title: Referencia
          type: string
        withdrawal:
          default: 0
          description: En caso de ser un retiro de la cuenta, el monto retirado
          title: Retiro
          type: number
      required:
      - reference
      - date
      - bank
      - deposit
      - withdrawal
      type: object
    BankTransactionResult:
      description: Contiene el resultado de la petición al endpoint de movimientos bancarios.
      properties:
        message:
          default: ''
          description: Mensaje generado por el endpoint
          title: Mensaje
          type: string
        status:
          default: 0
          description: Status de la petición
          title: Status
          type: integer
        transaction_bank:
          description: Movimiento bancario solicitado
          properties:
            bank:
              default: ''
              description: Banco / Caja / Tarjeta donde se realiza el movimiento bancario
              title: Banco
              type: string
            date:
              default: ''
              description: Fecha del movimiento bancario
              format: date
              title: Fecha
              type: string
            deposit:
              default: 0
              description: En caso de ser un depósito a la cuenta, el monto depositado
              title: Deposito
              type: number
            description:
              default: ''
              description: Descripción del movimiento bancario
              title: Descripción
              type: string
            id:
              default: 0
              description: Identificador del movimiento en sistema
              title: ID
              type: integer
            reference:
              default: ''
              description: Referencia del movimiento bancario
              title: Referencia
              type: string
