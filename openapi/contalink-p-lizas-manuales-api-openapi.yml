        source: "<?php\nrequire_once 'HTTP/Request2.php';\n$request = new HTTP_Request2();\n$request->setUrl('{{baseUrl}}/accounting/manual-accounting-policy/');\n$request->setMethod(HTTP_Request2::METHOD_POST);\n$request->setConfig(array(\n   'follow_redirects' => TRUE\n));\n$request->setHeader(array(\n   'Content-Type' => 'application/json',\n   'Accept' => 'application/json',\n   'Content-Length' => ''\n));\n$request->setBody('{\\n  \"record_date\": \"<date>\",\\n  \"description\": \"<string>\",\\n  \"accounting_records\": {\\n    \"account_code\": \"<string>\",\\n    \"debit\": \"<number>\",\\n    \"credit\": \"<number>\"\\n  }\\n}');\ntry {\n   $response = $request->send();\n   if ($response->getStatus() == 200) {\n      echo $response->getBody();\n   }\n   else {\n      echo 'Unexpected HTTP status: ' . $response->getStatus() . ' ' .\n      $response->getReasonPhrase();\n   }\n}\ncatch(HTTP_Request2_Exception $e) {\n   echo 'Error: ' . $e->getMessage();\n}"
      - lang: PHP
        source: "<?php\n\n$curl = curl_init();\n\ncurl_setopt_array($curl, array(\n   CURLOPT_URL => '%7B%7BbaseUrl%7D%7D/accounting/manual-accounting-policy/',\n   CURLOPT_RETURNTRANSFER => true,\n   CURLOPT_ENCODING => '',\n   CURLOPT_MAXREDIRS => 10,\n   CURLOPT_TIMEOUT => 0,\n   CURLOPT_FOLLOWLOCATION => true,\n   CURLOPT_HTTP_VERSION => CURL_HTTP_VERSION_1_1,\n   CURLOPT_CUSTOMREQUEST => 'POST',\n   CURLOPT_POSTFIELDS =>'{\n  \"record_date\": \"<date>\",\n  \"description\": \"<string>\",\n  \"accounting_records\": {\n    \"account_code\": \"<string>\",\n    \"debit\": \"<number>\",\n    \"credit\": \"<number>\"\n  }\n}',\n   CURLOPT_HTTPHEADER => array(\n      'Content-Type: application/json',\n      'Accept: application/json',\n      'Content-Length: '\n   ),\n));\n\n$response = curl_exec($curl);\n\ncurl_close($curl);\necho $response;\n"
