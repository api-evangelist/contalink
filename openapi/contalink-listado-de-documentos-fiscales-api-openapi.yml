        source: "Unirest.setTimeouts(0, 0);\nHttpResponse<String> response = Unirest.get(\"{{baseUrl}}/invoices/list/?transaction_type=<string>&document_type=<string>&rfc=<string>&start_date=<date>&end_date=<date>&page=<int32>\")\n   .header(\"Accept\", \"application/json\")\n   .asString();\n"
      - lang: JavaScript
        source: "var myHeaders = new Headers();\nmyHeaders.append(\"Accept\", \"application/json\");\n\nvar requestOptions = {\n   method: 'GET',\n   headers: myHeaders,\n   redirect: 'follow'\n};\n\nfetch(\"{{baseUrl}}/invoices/list/?transaction_type=<string>&document_type=<string>&rfc=<string>&start_date=<date>&end_date=<date>&page=<int32>\", requestOptions)\n   .then(response => response.text())\n   .then(result => console.log(result))\n   .catch(error => console.log('error', error));"
      - lang: JavaScript
        source: "\nvar xhr = new XMLHttpRequest();\nxhr.withCredentials = true;\n\nxhr.addEventListener(\"readystatechange\", function() {\n   if(this.readyState === 4) {\n      console.log(this.responseText);\n   }\n});\n\nxhr.open(\"GET\", \"%7B%7BbaseUrl%7D%7D/invoices/list/?transaction_type=%3Cstring%3E&document_type=%3Cstring%3E&rfc=%3Cstring%3E&start_date=%3Cdate%3E&end_date=%3Cdate%3E&page=%3Cint32%3E\");\nxhr.setRequestHeader(\"Accept\", \"application/json\");\n\nxhr.send();"
      - lang: JavaScript
        source: "var settings = {\n   \"url\": \"{{baseUrl}}/invoices/list/?transaction_type=<string>&document_type=<string>&rfc=<string>&start_date=<date>&end_date=<date>&page=<int32>\",\n   \"method\": \"GET\",\n   \"timeout\": 0,\n   \"headers\": {\n      \"Accept\": \"application/json\"\n   },\n};\n\n$.ajax(settings).done(function (response) {\n   console.log(response);\n});"
      - lang: NodeJS
