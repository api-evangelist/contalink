        source: "open Lwt\nopen Cohttp\nopen Cohttp_lwt_unix\n\nlet postData = ref \"{\\n  \\\"record_date\\\": \\\"<date>\\\",\\n  \\\"description\\\": \\\"<string>\\\",\\n  \\\"accounting_records\\\": {\\n    \\\"account_code\\\": \\\"<string>\\\",\\n    \\\"debit\\\": \\\"<number>\\\",\\n    \\\"credit\\\": \\\"<number>\\\"\\n  }\\n}\";;\n\nlet reqBody = \n   let uri = Uri.of_string \"%7B%7BbaseUrl%7D%7D/accounting/manual-accounting-policy/\" in\n   let headers = Header.init ()\n      |> fun h -> Header.add h \"Content-Type\" \"application/json\"\n      |> fun h -> Header.add h \"Accept\" \"application/json\"\n      |> fun h -> Header.add h \"Content-Length\" \"\"\n   in\n   let body = Cohttp_lwt.Body.of_string !postData in\n\n   Client.call ~headers ~body `POST uri >>= fun (_resp, body) ->\n   body |> Cohttp_lwt.Body.to_string >|= fun body -> body\n\nlet () =\n   let respBody = Lwt_main.run reqBody in\n   print_endline (respBody)"
