      - lang: NodeJS
        source: "var https = require('follow-redirects').https;\nvar fs = require('fs');\n\nvar options = {\n   'method': 'POST',\n   'hostname': '{{baseUrl}}',\n   'path': '/accounting/manual-accounting-policy/',\n   'headers': {\n      'Content-Type': 'application/json',\n      'Accept': 'application/json',\n      'Content-Length': ''\n   },\n   'maxRedirects': 20\n};\n\nvar req = https.request(options, function (res) {\n   var chunks = [];\n\n   res.on(\"data\", function (chunk) {\n      chunks.push(chunk);\n   });\n\n   res.on(\"end\", function (chunk) {\n      var body = Buffer.concat(chunks);\n      console.log(body.toString());\n   });\n\n   res.on(\"error\", function (error) {\n      console.error(error);\n   });\n});\n\nvar postData = JSON.stringify({\n   \"record_date\": \"<date>\",\n   \"description\": \"<string>\",\n   \"accounting_records\": {\n      \"account_code\": \"<string>\",\n      \"debit\": \"<number>\",\n      \"credit\": \"<number>\"\n   }\n});\n\nreq.write(postData);\n\nreq.end();"
