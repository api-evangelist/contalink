      - lang: Swift
        source: "import Foundation\n#if canImport(FoundationNetworking)\nimport FoundationNetworking\n#endif\n\nvar semaphore = DispatchSemaphore (value: 0)\n\nlet parameters = \"{\\n  \\\"record_date\\\": \\\"<date>\\\",\\n  \\\"description\\\": \\\"<string>\\\",\\n  \\\"accounting_records\\\": {\\n    \\\"account_code\\\": \\\"<string>\\\",\\n    \\\"debit\\\": \\\"<number>\\\",\\n    \\\"credit\\\": \\\"<number>\\\"\\n  }\\n}\"\nlet postData = parameters.data(using: .utf8)\n\nvar request = URLRequest(url: URL(string: \"{{baseUrl}}/accounting/manual-accounting-policy/\")!,timeoutInterval: Double.infinity)\nrequest.addValue(\"application/json\", forHTTPHeaderField: \"Content-Type\")\nrequest.addValue(\"application/json\", forHTTPHeaderField: \"Accept\")\nrequest.addValue(\"\", forHTTPHeaderField: \"Content-Length\")\n\nrequest.httpMethod = \"POST\"\nrequest.httpBody = postData\n\nlet task = URLSession.shared.dataTask(with: request) { data, response, error in \n   guard let data = data else {\n      print(String(describing: error))\n      semaphore.signal()\n      return\n   }\n   print(String(data: data, encoding: .utf8)!)\n   semaphore.signal()\n}\n\ntask.resume()\nsemaphore.wait()\n"
  /accounting/manual-accounting-policy/{policyid}/:
    delete:
      description: Elimina una póliza manual de los registros del sistema
      parameters:
      - description: Id de la póliza que se requiere eliminar
        in: path
        name: policyid
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualPolicyResponse'
          description: 0 indica error, 1 indica éxito. En la respuesta se incluye la información de la póliza eliminada
      security:
      - APIKey: []
      summary: Elimina una póliza manual
      tags:
      - Pólizas manuales
