openapi: 3.0.0
info:
  description: '# Introducción

    Documentación del API de Contalink


    # Autenticación


    El método de autenticación para el api de contalink es mediante un api key el cual está relacionado forzosamente a un usuario dentro del sistema, por lo cual, todas las peticiones utilizando ese api key quedarán registradas como peticiones del usuario relacionado.


    <SecurityDefinitions />

    '
  title: API Contalink Balanza de comprobación Listado de documentos fiscales API
  version: 1.0.4
  x-logo:
    altText: Contalink
    url: http://apidocs.contalink.com/logocontalinknew.svg
servers:
- description: prod
  url: https://794lol2h95.execute-api.us-east-1.amazonaws.com/prod
tags:
- description: Obtiene un listado de los documentos fiscales que correspondan a los filtros enviados
  name: Listado de documentos fiscales
paths:
  /invoices/list/:
    get:
      description: Obtiene un listado de documentos fiscales.
      parameters:
      - description: Indica si se quieren obtener los documentos fiscales emitidos o recibidos
        in: query
        name: transaction_type
        required: true
        schema:
          enum:
          - E
          - R
          type: string
      - description: Tipo de documento fiscal que se quiere obtener. (Comprobantes de nómina, Facturas, Notas de crédito, Complementos de pago)
        in: query
        name: document_type
        required: true
        schema:
          enum:
          - Nomina
          - Ingreso
          - Egreso
          - Pago
          type: string
      - description: RFC de la empresa para la cual se quieren obtener los documentos fiscales
        in: query
        name: rfc
        required: true
        schema:
          type: string
      - description: Fecha inicial para obtener los documentos (YYYY-MM-DD)
        in: query
        name: start_date
        required: true
        schema:
          format: date
          type: string
      - description: Fecha final para obtener los documentos (YYYY-MM-DD)
        in: query
        name: end_date
        required: true
        schema:
          format: date
          type: string
      - description: Parámetro opcional que indica el número de página a obtener, si no se especifica, su valor será 0
        in: query
        name: page
        required: false
        schema:
          format: int32
          type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceList'
          description: 0 indica error, 1 indica éxito.
      security:
      - APIKey: []
      summary: Obtiene un listado de documentos fiscales
      tags:
      - Listado de documentos fiscales
      x-codeSamples:
      - lang: C
        source: "CURL *curl;\nCURLcode res;\ncurl = curl_easy_init();\nif(curl) {\n   curl_easy_setopt(curl, CURLOPT_CUSTOMREQUEST, \"GET\");\n   curl_easy_setopt(curl, CURLOPT_URL, \"%7B%7BbaseUrl%7D%7D/invoices/list/?transaction_type=%3Cstring%3E&document_type=%3Cstring%3E&rfc=%3Cstring%3E&start_date=%3Cdate%3E&end_date=%3Cdate%3E&page=%3Cint32%3E\");\n   curl_easy_setopt(curl, CURLOPT_FOLLOWLOCATION, 1L);\n   curl_easy_setopt(curl, CURLOPT_DEFAULT_PROTOCOL, \"https\");\n   struct curl_slist *headers = NULL;\n   headers = curl_slist_append(headers, \"Accept: application/json\");\n   curl_easy_setopt(curl, CURLOPT_HTTPHEADER, headers);\n   res = curl_easy_perform(curl);\n}\ncurl_easy_cleanup(curl);\n"
      - lang: C#
        source: 'var client = new RestClient("{{baseUrl}}/invoices/list/?transaction_type=<string>&document_type=<string>&rfc=<string>&start_date=<date>&end_date=<date>&page=<int32>");

          client.Timeout = -1;

          var request = new RestRequest(Method.GET);

          request.AddHeader("Accept", "application/json");

          IRestResponse response = client.Execute(request);

          Console.WriteLine(response.Content);'
      - lang: Curl
        source: 'curl --location -g --request GET ''{{baseUrl}}/invoices/list/?transaction_type=<string>&document_type=<string>&rfc=<string>&start_date=<date>&end_date=<date>&page=<int32>'' \

          --header ''Accept: application/json'''
      - lang: Dart
        source: "var headers = {\n   'Accept': 'application/json'\n};\nvar request = http.Request('GET', Uri.parse('{{baseUrl}}/invoices/list/?transaction_type=<string>&document_type=<string>&rfc=<string>&start_date=<date>&end_date=<date>&page=<int32>'));\n\nrequest.headers.addAll(headers);\n\nhttp.StreamedResponse response = await request.send();\n\nif (response.statusCode == 200) {\n   print(await response.stream.bytesToString());\n}\nelse {\n   print(response.reasonPhrase);\n}\n"
      - lang: Go
        source: "package main\n\nimport (\n   \"fmt\"\n   \"net/http\"\n   \"io/ioutil\"\n)\n\nfunc main() {\n\n   url := \"%7B%7BbaseUrl%7D%7D/invoices/list/?transaction_type=%3Cstring%3E&document_type=%3Cstring%3E&rfc=%3Cstring%3E&start_date=%3Cdate%3E&end_date=%3Cdate%3E&page=%3Cint32%3E\"\n   method := \"GET\"\n\n   client := &http.Client {\n   }\n   req, err := http.NewRequest(method, url, nil)\n\n   if err != nil {\n      fmt.Println(err)\n      return\n   }\n   req.Header.Add(\"Accept\", \"application/json\")\n\n   res, err := client.Do(req)\n   if err != nil {\n      fmt.Println(err)\n      return\n   }\n   defer res.Body.Close()\n\n   body, err := ioutil.ReadAll(res.Body)\n   if err != nil {\n      fmt.Println(err)\n      return\n   }\n   fmt.Println(string(body))\n}"
      - lang: Http
        source: 'GET /invoices/list/?transaction_type=<string>&document_type=<string>&rfc=<string>&start_date=<date>&end_date=<date>&page=<int32> HTTP/1.1

